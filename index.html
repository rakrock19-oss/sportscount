<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 운동 기록부</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Noto Sans KR & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (깔끔한 UI 아이콘용) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased selection:bg-indigo-100 selection:text-indigo-700">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
                    <i data-lucide="activity" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight">학생 운동 기록부</h1>
                </div>
            </div>
            <!-- 연동 상태 표시 배지 -->
            <span id="syncStatusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-200/80">
                <span id="syncStatusDot" class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                <span id="syncStatusText">구글 시트 연결 중...</span>
            </span>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 space-y-8">

        <!-- 1. 운동 기록 입력 폼 카드 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
            <div class="mb-6">
                <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
                    새 운동 기록 입력
                </h2>
                <p class="text-sm text-slate-500 mt-1">학생과 종목을 선택한 뒤 오늘의 운동 결과를 기록해 주세요.</p>
            </div>

            <form id="workoutForm" class="space-y-6">
                <!-- 학생 이름 드롭다운 -->
                <div>
                    <label for="studentSelect" class="block text-sm font-semibold text-slate-700 mb-2">
                        학생 이름
                    </label>
                    <div class="relative">
                        <select id="studentSelect" required disabled
                            class="w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 py-3 pr-10 text-sm font-medium text-slate-800 shadow-xs transition focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/10 disabled:bg-slate-100 disabled:text-slate-400">
                            <option value="" disabled selected>학생 명단을 불러오는 중...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <!-- 운동 종목 선택 (라디오 카드 형태) -->
                <div>
                    <span class="block text-sm font-semibold text-slate-700 mb-2">
                        운동 종목
                    </span>
                    <div class="grid grid-cols-3 gap-3" role="radiogroup" aria-label="운동 종목 선택">
                        <!-- 달리기 -->
                        <label class="cursor-pointer">
                            <input type="radio" name="sportType" value="달리기" class="peer sr-only" checked>
                            <div class="flex flex-col items-center justify-center gap-1.5 rounded-xl border-2 border-slate-200 bg-slate-50/50 p-3.5 text-center transition-all hover:bg-slate-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50/60 peer-checked:text-indigo-700">
                                <span class="text-2xl" aria-hidden="true">🏃‍♂️</span>
                                <span class="text-sm font-bold">달리기</span>
                            </div>
                        </label>

                        <!-- 축구 -->
                        <label class="cursor-pointer">
                            <input type="radio" name="sportType" value="축구" class="peer sr-only">
                            <div class="flex flex-col items-center justify-center gap-1.5 rounded-xl border-2 border-slate-200 bg-slate-50/50 p-3.5 text-center transition-all hover:bg-slate-50 peer-checked:border-emerald-600 peer-checked:bg-emerald-50/60 peer-checked:text-emerald-700">
                                <span class="text-2xl" aria-hidden="true">⚽</span>
                                <span class="text-sm font-bold">축구</span>
                            </div>
                        </label>

                        <!-- 줄넘기 -->
                        <label class="cursor-pointer">
                            <input type="radio" name="sportType" value="줄넘기" class="peer sr-only">
                            <div class="flex flex-col items-center justify-center gap-1.5 rounded-xl border-2 border-slate-200 bg-slate-50/50 p-3.5 text-center transition-all hover:bg-slate-50 peer-checked:border-amber-500 peer-checked:bg-amber-50/60 peer-checked:text-amber-700">
                                <span class="text-2xl" aria-hidden="true">🪢</span>
                                <span class="text-sm font-bold">줄넘기</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 기록 입력 & 메모 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="recordValue" class="block text-sm font-semibold text-slate-700 mb-2">
                            운동 기록 <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="recordValue" required
                            placeholder="예: 100m 15.2초"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 placeholder:text-slate-400 shadow-xs transition focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/10">
                    </div>

                    <div>
                        <label for="recordMemo" class="block text-sm font-semibold text-slate-700 mb-2">
                            간단 메모 <span class="text-xs font-normal text-slate-400">(선택)</span>
                        </label>
                        <input type="text" id="recordMemo"
                            placeholder="예: 자세가 많이 좋아짐"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-800 placeholder:text-slate-400 shadow-xs transition focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/10">
                    </div>
                </div>

                <!-- 제출 버튼 -->
                <div class="pt-1">
                    <button type="submit" id="submitBtn"
                        class="w-full flex items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-3.5 text-sm font-bold text-white shadow-sm transition hover:bg-indigo-700 active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-indigo-500/20 disabled:opacity-60 disabled:cursor-not-allowed">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span id="submitBtnText">기록 저장하기</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. 입력된 기록 목록 (최신순) -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-2">
                    <h2 class="text-base font-bold text-slate-900">최근 운동 기록</h2>
                    <span id="recordCount" class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">
                        0건
                    </span>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" id="refreshBtn" onclick="fetchSheetData()"
                        class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 hover:text-indigo-600 transition">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        새로고침
                    </button>
                    <span class="text-xs text-slate-300">|</span>
                    <span class="text-xs text-slate-400">최신순 정렬</span>
                </div>
            </div>

            <!-- 기록 카드 리스트 컨테이너 -->
            <div id="recordList" class="space-y-3">
                <!-- 초기 로딩 스켈레톤 -->
                <div class="bg-white rounded-2xl border border-slate-200/80 p-8 text-center">
                    <p class="text-slate-500 text-sm font-medium">구글 시트에서 기록을 불러오는 중입니다...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- 알림 토스트 (alert 대체용) -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-2">
        <div class="bg-slate-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
            <i id="toastIcon" data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
            <span id="toastMessage">기록이 저장되었습니다.</span>
        </div>
    </div>

    <script>
        /**
         * Google Apps Script 웹 앱 배포 URL
         */
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqn__hJiE2A1KLQ7VKKDubV6MBQ0aKMbxiIMDfOzlJS8N7B8Nq8G9ioppq7cPWDPx0/exec';

        // 서버에서 불러온 상태 데이터
        let students = [];
        let records = [];
        let isLoading = false;
        let isSubmitting = false;

        // DOM 요소 참조
        const workoutForm = document.getElementById('workoutForm');
        const studentSelect = document.getElementById('studentSelect');
        const recordValueInput = document.getElementById('recordValue');
        const recordMemoInput = document.getElementById('recordMemo');
        const recordListEl = document.getElementById('recordList');
        const recordCountEl = document.getElementById('recordCount');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const syncStatusBadge = document.getElementById('syncStatusBadge');
        const syncStatusDot = document.getElementById('syncStatusDot');
        const syncStatusText = document.getElementById('syncStatusText');
        const sportRadios = document.querySelectorAll('input[name="sportType"]');

        // 종목별 안내 문구(Placeholder) 및 스타일 매핑
        const sportConfig = {
            '달리기': {
                placeholder: '예: 100m 15.2초, 오래달리기 5바퀴',
                emoji: '🏃‍♂️',
                badgeClass: 'bg-indigo-50 text-indigo-700 border-indigo-200/70'
            },
            '축구': {
                placeholder: '예: 슈팅 5회 중 4골, 드리블 22초',
                emoji: '⚽',
                badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200/70'
            },
            '줄넘기': {
                placeholder: '예: 1분 120회, 쌩쌩이 30회',
                emoji: '🪢',
                badgeClass: 'bg-amber-50 text-amber-700 border-amber-200/70'
            }
        };

        /**
         * 종목 변경 시 입력창의 예시 텍스트(placeholder) 자동 업데이트
         */
        sportRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const selectedSport = e.target.value;
                if (sportConfig[selectedSport]) {
                    recordValueInput.placeholder = sportConfig[selectedSport].placeholder;
                }
            });
        });

        /**
         * 상단 연결 상태 배지 업데이트
         */
        function updateSyncStatus(state, text) {
            syncStatusText.textContent = text;
            if (state === 'loading') {
                syncStatusBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-200/80';
                syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse';
            } else if (state === 'connected') {
                syncStatusBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200/80';
                syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
            } else if (state === 'error') {
                syncStatusBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200/80';
                syncStatusDot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
            }
        }

        /**
         * 토스트 알림 표시 함수
         */
        let toastTimeout;
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.textContent = message;
            if (isError) {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.className = 'w-4 h-4 text-rose-400';
            } else {
                toastIcon.setAttribute('data-lucide', 'check-circle-2');
                toastIcon.className = 'w-4 h-4 text-emerald-400';
            }
            lucide.createIcons();

            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2500);
        }

        /**
         * Google Apps Script GET 호출: 학생명단과 최신 운동 기록 불러오기
         * (커스텀 헤더 없이 단순 GET 요청으로 호출하여 CORS Preflight 회피)
         */
        async function fetchSheetData() {
            if (isLoading) return;
            isLoading = true;
            updateSyncStatus('loading', '데이터 동기화 중...');

            try {
                // 커스텀 헤더 없이 단순 fetch 호출
                const response = await fetch(APPS_SCRIPT_URL);
                if (!response.ok) {
                    throw new Error(`서버 응답 오류 (${response.status})`);
                }

                const result = await response.json();
                if (result.status !== 'success') {
                    throw new Error(result.message || '데이터를 불러오지 못했습니다.');
                }

                students = result.students || [];
                records = result.records || [];

                renderStudentDropdown();
                renderRecords();
                updateSyncStatus('connected', '구글 시트 연결됨');
            } catch (error) {
                console.error('데이터 조회 실패:', error);
                updateSyncStatus('error', '연결 오류');
                showToast('구글 시트 데이터를 불러오지 못했습니다.', true);
                
                if (records.length === 0) {
                    recordListEl.innerHTML = `
                        <div class="bg-white rounded-2xl border border-rose-200 p-8 text-center space-y-2">
                            <p class="text-rose-600 text-sm font-semibold">데이터를 불러오는 중 오류가 발생했습니다.</p>
                            <p class="text-slate-400 text-xs">${escapeHtml(error.message)}</p>
                            <button type="button" onclick="fetchSheetData()" class="mt-2 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-medium text-slate-700 transition">
                                다시 시도하기
                            </button>
                        </div>
                    `;
                }
            } finally {
                isLoading = false;
            }
        }

        /**
         * 받아온 학생명단으로 드롭다운 채우기
         */
        function renderStudentDropdown() {
            const previousSelected = studentSelect.value;

            if (students.length === 0) {
                studentSelect.innerHTML = '<option value="" disabled selected>등록된 학생이 없습니다</option>';
                studentSelect.disabled = true;
                return;
            }

            const optionsHtml = [
                '<option value="" disabled selected>기록할 학생을 선택하세요</option>',
                ...students.map(s => {
                    const label = s.number ? `${s.number}번 ${s.name}` : s.name;
                    return `<option value="${escapeHtml(s.name)}">${escapeHtml(label)}</option>`;
                })
            ].join('');

            studentSelect.innerHTML = optionsHtml;
            studentSelect.disabled = false;

            // 기존에 선택되어 있던 학생이 명단에 여전히 존재하면 선택 상태 유지
            if (previousSelected && students.some(s => s.name === previousSelected)) {
                studentSelect.value = previousSelected;
            }
        }

        /**
         * 기록 목록 렌더링 함수 (서버에서 최신순으로 전달됨)
         */
        function renderRecords() {
            recordCountEl.textContent = `${records.length}건`;

            if (records.length === 0) {
                recordListEl.innerHTML = `
                    <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center">
                        <p class="text-slate-500 text-sm font-medium">아직 입력된 운동 기록이 없습니다.</p>
                        <p class="text-slate-400 text-xs mt-1">위 폼에서 첫 번째 운동 기록을 추가해 보세요!</p>
                    </div>
                `;
                return;
            }

            recordListEl.innerHTML = records.map((item, index) => {
                const config = sportConfig[item.sport] || {
                    placeholder: '',
                    emoji: '🏅',
                    badgeClass: 'bg-slate-100 text-slate-700 border-slate-200'
                };
                const isNewest = index === 0;

                return `
                    <article class="group bg-white rounded-2xl border ${isNewest ? 'border-indigo-200 shadow-sm' : 'border-slate-200/80'} p-4 sm:p-5 transition hover:border-slate-300 flex items-start justify-between gap-4">
                        <div class="flex items-start gap-3.5 min-w-0">
                            <!-- 종목 아이콘 배지 -->
                            <div class="w-11 h-11 rounded-xl bg-slate-50 border border-slate-200/60 flex items-center justify-center text-xl shrink-0">
                                ${config.emoji}
                            </div>

                            <!-- 기록 상세 정보 -->
                            <div class="min-w-0">
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="font-bold text-slate-900 text-base">${escapeHtml(item.student)}</span>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold border ${config.badgeClass}">
                                        ${escapeHtml(item.sport)}
                                    </span>
                                    ${isNewest ? '<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-indigo-600 text-white">NEW</span>' : ''}
                                </div>

                                <p class="text-slate-800 font-semibold text-sm sm:text-base mt-1.5">
                                    ${escapeHtml(item.value)}
                                </p>

                                ${item.memo ? `
                                    <p class="text-slate-500 text-xs sm:text-sm mt-1 flex items-center gap-1">
                                        <i data-lucide="message-square" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                                        <span class="truncate">${escapeHtml(item.memo)}</span>
                                    </p>
                                ` : ''}
                            </div>
                        </div>

                        <!-- 우측 서버 기록 시간 표시 -->
                        <div class="flex flex-col items-end justify-start shrink-0">
                            <span class="text-xs text-slate-400 font-medium">${escapeHtml(item.timestamp)}</span>
                        </div>
                    </article>
                `;
            }).join('');

            // 동적으로 생성된 아이콘 초기화
            lucide.createIcons();
        }

        /**
         * XSS 방지를 위한 간단한 HTML 이스케이프
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * 폼 제출 이벤트 핸들러 (Google Apps Script POST 저장)
         */
        workoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmitting) return;

            const student = studentSelect.value;
            const selectedSportEl = document.querySelector('input[name="sportType"]:checked');
            const sport = selectedSportEl ? selectedSportEl.value : '달리기';
            const rawValue = recordValueInput.value.trim();
            const memo = recordMemoInput.value.trim();

            if (!student) {
                studentSelect.focus();
                showToast('학생 이름을 선택해 주세요.', true);
                return;
            }

            if (!rawValue) {
                recordValueInput.focus();
                showToast('운동 기록을 입력해 주세요.', true);
                return;
            }

            // 메모가 입력된 경우 시트의 '기록' 열에 함께 깔끔히 저장되도록 합침
            const combinedValue = memo ? `${rawValue} (${memo})` : rawValue;

            // 전송 중 UI 상태 잠금
            isSubmitting = true;
            submitBtn.disabled = true;
            submitBtnText.textContent = '구글 시트에 저장 중...';
            updateSyncStatus('loading', '저장 중...');

            try {
                // CORS Preflight(OPTIONS)를 발생시키지 않기 위해 headers 옵션 없이 text/plain으로 JSON 문자열 전송
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        student: student,
                        sport: sport,
                        value: combinedValue
                    })
                });

                if (!response.ok) {
                    throw new Error(`저장 요청 실패 (${response.status})`);
                }

                const result = await response.json();
                if (result.status !== 'success') {
                    throw new Error(result.message || '시트 저장에 실패했습니다.');
                }

                // 서버에서 반환된 저장 결과(서버 타임스탬프 포함)를 목록 최상단에 즉시 반영
                const savedItem = result.data || {
                    student: student,
                    sport: sport,
                    value: combinedValue,
                    timestamp: '방금 전'
                };
                records.unshift(savedItem);
                renderRecords();

                // 입력 필드 초기화
                recordValueInput.value = '';
                recordMemoInput.value = '';
                recordValueInput.focus();

                updateSyncStatus('connected', '구글 시트 연결됨');
                showToast(`${student} 학생의 ${sport} 기록이 저장되었습니다.`);
            } catch (error) {
                console.error('기록 저장 실패:', error);
                updateSyncStatus('error', '저장 실패');
                showToast(`저장 실패: ${error.message}`, true);
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtnText.textContent = '기록 저장하기';
            }
        });

        // 페이지 로드 시 구글 시트 데이터 불러오기 및 아이콘 활성화
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchSheetData();
        });
    </script>
</body>
</html>
